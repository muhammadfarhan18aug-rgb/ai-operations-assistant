services:
  db:
    image: postgres:16-alpine
    container_name: ai-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_operations_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_operations_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
